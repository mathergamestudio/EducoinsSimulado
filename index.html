<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity Web Player | SimuladoEdu</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />

    <style>
      #unity-logo { display: none; }
    </style>
  </head>

  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">SimuladoEdu</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var gameInstance = null;

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // ✅ Base automática (funciona em: usuario.github.io e usuario.github.io/repo)
      var basePath = location.pathname;
      // remove o "index.html" se estiver no caminho
      basePath = basePath.replace(/index\.html$/, "");
      // garante que termina com /
      if (!basePath.endsWith("/")) basePath += "/";

      // ✅ URLs absolutas com basePath
      var buildUrl = basePath + "Build";
      var loaderUrl = buildUrl + "/Edu web.loader";

      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Edu web.data.unityweb",
        frameworkUrl: buildUrl + "/Edu web.framework.js.unityweb",
        codeUrl: buildUrl + "/Edu web.wasm.unityweb",
        streamingAssetsUrl: basePath + "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "SimuladoEdu",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        devicePixelRatio: window.devicePixelRatio
      };

      // 📱 Mobile
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);

        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "1920px";
        canvas.style.height = "1080px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
        })
        .then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          gameInstance = unityInstance;

          try { unityInstance.SetFullscreen(1); } catch (e) {}

          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          canvas.addEventListener("click", () => {
            if (!document.fullscreenElement && gameInstance) {
              gameInstance.SetFullscreen(1);
            }
          });
        })
        .catch((message) => alert(message));
      };

      script.onerror = () => {
        alert(
          "Erro ao carregar o loader.\n\n" +
          "Tente abrir este link no navegador e veja se dá 404:\n" +
          loaderUrl
        );
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
